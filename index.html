<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EverGift — The Digital Home for Your Love Story</title>
    <meta name="description" content="The world's first ethereal love vault. Create a magical digital care package for your girlfriend or loved one. Express your love with photos, videos, and heartfelt voice notes." />
    <meta name="keywords" content="love, relationship goals, gift for girlfriend, digital care package, romantic ideas, how to show love, long distance relationship help, heartfelt messages, memory vault" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://loveers.vercel.app/" />
    <meta property="og:title" content="EverGift — Where Your Love Story Lives Forever" />
    <meta property="og:description" content="A magical ethereal vault for your most cherished memories. Share the love with a personalized digital care package." />
    <meta property="og:image" content="https://loveers.vercel.app/og-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://loveers.vercel.app/" />
    <meta property="twitter:title" content="EverGift — The Ultimate Personalized Digital Gift" />
    <meta property="twitter:description" content="A magical way to share memories. Perfect for anniversaries and long-distance surprises." />

    <!-- AI Semantic Data (Schema.org) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Service",
      "name": "EverGift Digital Gifting",
      "description": "A personalized digital care package and memory vault service.",
      "provider": {
        "@type": "Organization",
        "name": "EverGift"
      },
      "areaServed": "Worldwide",
      "offers": {
        "@type": "Offer",
        "price": "50",
        "priceCurrency": "KES"
      },
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Personalized Gifts",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Personalized Digital Memory Vault"
            }
          }
        ]
      }
    }
    </script>

    <script src="https://js.paystack.co/v1/inline.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#faf9f8] text-[#1a1c1c] antialiased selection:bg-[#e0d7ff] selection:text-[#1c1735] overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
